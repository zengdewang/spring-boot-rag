spring:
  application:
    name: rag
  # 激活 local 配置（application-local.yml 里放 API Key 等敏感信息）
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意端口是 3307（容器映射），不是 3306
    url: jdbc:mysql://localhost:3307/rag_kb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}   # 实际密码在 application-local.yml

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
    banner: false

# ==================== 大模型与向量化 ====================
llm:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}       # 实际 Key 在 application-local.yml
    model: deepseek-v4-flash            # 或 deepseek-v4-pro
    timeout-seconds: 30

  embedding:
    base-url: https://api.siliconflow.cn/v1
    api-key: ${SILICONFLOW_API_KEY:}    # 实际 Key 在 application-local.yml
    model: BAAI/bge-m3
    dimension: 1024

# ==================== Milvus 向量库 ====================
milvus:
  host: localhost
  port: 19530
  collection: rag_docs
